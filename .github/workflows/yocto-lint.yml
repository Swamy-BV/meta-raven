name: Yocto lint
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oelint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.3.0
      - name: Check project rules
        run: pre-commit run --all-files

  bsp-metadata:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential chrpath cpio debianutils diffstat \
            file gawk git iputils-ping libacl1 libcrypt-dev locales lz4 python3 \
            python3-git python3-jinja2 python3-pexpect python3-pip python3-subunit \
            repo socat texinfo unzip wget xz-utils zstd
          sudo locale-gen en_US.UTF-8
      - name: Synchronize the pinned BSP
        run: |
          mkdir linux
          cd linux
          repo init -u https://github.com/Swamy-BV/raven-manifest.git -b develop -m raven.xml
          repo sync --current-branch --no-clone-bundle -j2
          git -C sources/meta-raven fetch --no-tags ../../.. "$GITHUB_SHA"
          git -C sources/meta-raven checkout --detach FETCH_HEAD
          repo forall -c 'test -z "$(git status --porcelain)"'
      - name: Check BSP metadata and image dependencies
        shell: bash
        env:
          LANG: en_US.UTF-8
        run: |
          cd linux
          source ./raven-setup-release.sh -b build
          bitbake -p
          bitbake-layers show-appends > layer-appends.txt
          bitbake -g raven-image-swu
          bitbake -n raven-image-swu
