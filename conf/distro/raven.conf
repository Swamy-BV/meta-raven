# Shared Raven policy, using NXP's common i.MX distro settings.
require conf/distro/include/fsl-imx-base.inc
DISTRO = "raven"
DISTRO_NAME = "Raven Linux"
DISTRO_VERSION = "1.0.0"
DISTROOVERRIDES:append = ":raven"
DISTRO_FEATURES:remove = "\
    x11 wayland opengl \
    ${@'' if 'imxmali' in (d.getVar('MACHINEOVERRIDES') or '').split(':') else 'vulkan'} \
"
DISTRO_FEATURES:append = " overlayfs"

# Use NXP's compute-capable Mali driver without a second Mesa runtime.
IMX_MALI_DRIVERS:imxmali = "mali-imx"
# The vendor compute runtime also links the Vulkan loader. No display server.
DISTRO_FEATURES:append:imxmali = " vulkan"

# PX4/NuttX compiles small build-host utilities before invoking the M7 toolchain.
HOSTTOOLS:append = " cc ps"
