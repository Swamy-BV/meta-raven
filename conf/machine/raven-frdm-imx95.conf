# Raven development platform: FRDM-IMX95, 15x15 package and LPDDR4x.
# Retain the official board configuration as the hardware baseline.
MACHINEOVERRIDES =. "imx95-15x15-lpddr4x-frdm:"
require conf/machine/imx95-15x15-lpddr4x-frdm.conf

# Separate Raven target; keep NXP's FRDM board implementation unchanged.
UBOOT_CONFIG_BASENAME = "raven_frdm_imx95"
UBOOT_CONFIG = "sd"
UBOOT_DTB_NAME = "raven-frdm-imx95.dtb"

# Build the Raven SM partition in the boot container.
SYSTEM_MANAGER_CONFIG = "raven_frdm_drone"

# Use Raven PX4 as the M7 payload and boot-partition firmware.
M4_DEFAULT_IMAGE_MX95 = "raven_frdm_default.bin"
# Shared by imx-boot and SWUpdate so both select the same DDR boot container.
IMXBOOT_TARGETS = "flash_all_ddr"
IMAGE_BOOT_FILES:remove = " \
    mcore-demos/imx95-15x15-frdm_m7_TCM_hello_world.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
"
IMAGE_BOOT_FILES:append = " mcore-demos/raven_frdm_default.bin"

# Raven's factory eMMC image keeps NXP's i.MX boot-container placement.
WKS_FILE = "raven-frdm-imx95.wks.in"
RAVEN_ROOTFS_SIZE_MIB = "4096"
OVERLAYFS_MOUNT_POINT[state] = "/overlay"

# IMX477 on J11. Only Raven trees carry the M7 ownership exclusions.
RAVEN_CAMERA_DTB = "raven-frdm-imx95-imx477-isp.dtb"
KERNEL_DEVICETREE = "freescale/raven-frdm-imx95.dtb freescale/${RAVEN_CAMERA_DTB}"
KERNEL_DEVICETREE:remove = " \
    freescale/imx95-15x15-frdm.dtb \
    freescale/imx95-15x15-frdm-8mic-reve.dtb \
    freescale/imx95-15x15-frdm-ap1302.dtb \
    freescale/imx95-15x15-frdm-aud-hat.dtb \
    freescale/imx95-15x15-frdm-boe-wxga-lvds-panel.dtb \
    freescale/imx95-15x15-frdm-dual-os08a20-isp.dtb \
    freescale/imx95-15x15-frdm-neutron.dtb \
    freescale/imx95-15x15-frdm-os08a20-combo-isp.dtb \
    freescale/imx95-15x15-frdm-os08a20-isp.dtb \
    freescale/imx95-15x15-frdm-root.dtb \
    freescale/imx95-15x15-frdm-rpmsg.dtb \
    freescale/imx95-15x15-frdm-waveshare-7inch-c-panel.dtb \
"
