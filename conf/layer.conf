BBPATH .= ":${LAYERDIR}"
BBFILES += "\
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    ${LAYERDIR}/src/*/*/*.bb \
    ${LAYERDIR}/src/*/*/*.bbappend \
"
BBFILE_COLLECTIONS += "raven"
BBFILE_PATTERN_raven := "^${LAYERDIR}/"
BBFILE_PRIORITY_raven = "20"
LAYERSERIES_COMPAT_raven = "wrynose"
LAYERDEPENDS_raven = "\
    core \
    openembedded-layer \
    fsl-bsp-release \
    fsl-sdk-release \
    ros-common-layer \
    ros2-layer \
    ros2-jazzy-layer \
    swupdate \
    meta-freescale-ml \
    imx-machine-learning \
"
