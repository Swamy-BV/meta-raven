[Unit]
Requires=var-lib.mount
After=var-lib.mount
ConditionPathExists=/var/lib/wpa_supplicant/wpa_supplicant-mlan0.conf

[Service]
UMask=0077
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/var/lib/wpa_supplicant/wpa_supplicant-%I.conf -i%I
# Keep station reception responsive for telemetry and network video.
ExecStartPost=/usr/sbin/iw dev %I set power_save off
