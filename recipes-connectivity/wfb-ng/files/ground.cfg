# Matching WFB-ng 25.01.2 ground configuration; use on the receiver host.
# Provision gs.key in conf_dir and use WIFIBROADCAST_CFG to select this file.
[path]
conf_dir = '@LOCALSTATEDIR@/lib/wfb-ng'
bin_dir = '@BINDIR@'

[common]
wifi_region = 'US'
wifi_channel = 165
wifi_txpower = None
set_nm_unmanaged = False

[gs]
streams = [{'name': 'video', 'stream_rx': 0x00, 'stream_tx': None,
            'service_type': 'udp_direct_rx', 'profiles': ['base', 'gs_base', 'video', 'gs_video']},
           {'name': 'mavlink', 'stream_rx': 0x10, 'stream_tx': 0x90,
            'service_type': 'mavlink', 'profiles': ['base', 'gs_base', 'mavlink', 'gs_mavlink']}]
link_domain = 'raven'
api_port = None

[gs_video]
peer = 'connect://127.0.0.1:5600'

[gs_mavlink]
peer = 'connect://127.0.0.1:14550'
