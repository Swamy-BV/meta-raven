# Site overrides; upstream master.cfg supplies the remaining defaults.
# Generate a unique key pair outside the image and provision both ends.
[path]
conf_dir = '@LOCALSTATEDIR@/lib/wfb-ng'
bin_dir = '@BINDIR@'
log_dir = '/run/wfb-ng'

[common]
wifi_region = 'US'
wifi_channel = 165
wifi_txpower = None
set_nm_unmanaged = False

[drone]
# Only video and MAVLink; do not create an IP tunnel or change default routes.
streams = [{'name': 'video', 'stream_rx': None, 'stream_tx': 0x00,
            'service_type': 'udp_direct_tx', 'profiles': ['base', 'drone_base', 'video', 'drone_video']},
           {'name': 'mavlink', 'stream_rx': 0x90, 'stream_tx': 0x10,
            'service_type': 'mavlink', 'profiles': ['base', 'drone_base', 'mavlink', 'drone_mavlink']}]
link_domain = 'raven'
api_port = None

[drone_video]
peer = 'listen://127.0.0.1:5602'

[drone_mavlink]
peer = 'listen://127.0.0.1:14560'
