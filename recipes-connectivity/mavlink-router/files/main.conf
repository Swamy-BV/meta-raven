[General]
# Local camera components may connect to the router using TCP.
TcpServerPort = 5760

[UartEndpoint px4]
# This channel is independent of ttyros, which remains owned by the DDS agent.
Device = /dev/ttyproxy
Baud = 921600
FlowControl = true

[UdpEndpoint ground-station]
# Configure QGroundControl to send to the board's address on port 14550.
# Server mode learns the peer from incoming traffic; no PC address is baked in.
Mode = Server
Address = 0.0.0.0
Port = 14550
