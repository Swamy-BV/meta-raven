/controller_bridge:
  ros__parameters:
    address: "127.0.0.1"
    port: 9090
    max_message_size: 65536
    incoming_queue_size: 16
    write_queue_size: 8
    use_compression: false
    default_call_service_timeout: 5.0
    topics_pub_glob: "[]"
    topics_sub_glob: >-
      ['/raven/vehicle_1/perception/tracks',
      '/raven/vehicle_1/cameras/front/camera_info',
      '/raven/vehicle_1/perception/label_info',
      '/raven/vehicle_1/autonomy/guidance/health']
    services_glob: "['/raven/vehicle_1/autonomy/guidance/select_target']"
    actions_glob: "[]"
