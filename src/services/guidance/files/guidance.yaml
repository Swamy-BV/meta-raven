/raven/vehicle_1/autonomy/guidance:
  ros__parameters:
    allow_unmapped_motion: false
    local_frame: px4_local_enu
    max_jerk: 1.0
    minimum_height: 2.0
    maximum_height: 12.0
    # Separate from the real M7 /fmu namespace. Service starts idle and never arms.
    px4_namespace: /simulation
    tracks_topic: /raven/vehicle_1/perception/tracks
    camera_info_topic: /raven/vehicle_1/cameras/front/camera_info
    labels_topic: /raven/vehicle_1/perception/label_info
    metadata_topic: /raven/vehicle_1/perception/vision_info
    # Position measurement deviation (m); acceleration spectral density (m^2/s^3).
    target_position_stddev: 0.35
    target_acceleration_noise: 0.5
    follow_distance: 8.0
    position_gain: 0.4
    # Path-normal correction only; path speed and turning feed-forward remain.
    cross_track_gain: 0.25
    max_cross_track_speed: 1.5
    max_speed: 0.6
    max_acceleration: 0.2
    max_yaw_rate: 0.2
    # Pause briefly; resume only the same ID. Expiration latches a hold.
    target_timeout: 0.35
    # Default retains fresh-only control; simulation profiles may opt into
    # covariance-bounded coasting without changing the latched loss timeout.
    target_prediction_seconds: 0.35
    target_prediction_stddev: 2.0
    target_loss_timeout: 1.5
    max_displacement: 30.0
    max_target_range: 40.0
    # Simulation mount/level-ground geometry; not physical-camera calibration.
    ground_z: 0.24
    camera_pitch: 0.3
    camera_forward: 0.2
    camera_right: 0.0
    camera_down: -0.1
