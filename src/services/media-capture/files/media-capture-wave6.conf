[Service]
SupplementaryGroups=video
# DPU G2D conversion and its CMA buffers; no desktop/display server is needed.
DeviceAllow=/dev/dri/card0 rw
DeviceAllow=/dev/dri/renderD128 rw
DeviceAllow=/dev/dma_heap/linux,cma rw
DeviceAllow=/dev/dma_heap/linux,cma-uncached rw

# CSI capture devices are dynamically numbered by the media graph.
DeviceAllow=char-video4linux rw
DeviceAllow=char-media rw
# Native 1080p uses the open Neo IPA; the supplied Uguzzi tuning only covers 4K.
Environment=LIBCAMERA_IPA_MODULE_PATH=/usr/lib/libcamera/ipa
Environment=LIBCAMERA_PIPELINES_MATCH_LIST=nxp/neo,imx8-isi,uvc
