/raven/vehicle_1/perception/target_tracker:
  ros__parameters:
    detections_topic: /raven/vehicle_1/perception/detections
    metadata_topic: /raven/vehicle_1/perception/vision_info
    # Empty keeps the established IoU baseline; opt in only to a qualified model.
    vehicle_reid_model: ""
    image_topic: /raven/vehicle_1/cameras/front/image_raw
    # Opt-in ground recovery needs rectified calibration and source-time PX4 pose.
    ground_association: false
    vehicle_classes: ["2", "5", "7"]
    # Retain unseen identities only while fresh detection frames continue.
    lost_seconds: 1.5
    # Reject stale measurements and clear tracking state on input silence.
    input_timeout_seconds: 0.75
    # Weak boxes may maintain an established ID; new IDs still require 0.7.
    low_threshold: 0.1
    # Moderate detections can reacquire a recently lost ID; creation stays strict.
    high_threshold: 0.5
    new_threshold: 0.7
    match_threshold: 0.8
    max_tracks_per_class: 32
    max_classes: 8
    max_detections: 128
