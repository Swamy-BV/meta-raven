[Service]
SupplementaryGroups=video
# FRDM's observed Wave6 decoder and encoder nodes.
DeviceAllow=/dev/video2 rw
DeviceAllow=/dev/video3 rw

# DPU G2D conversion and its CMA buffers; no desktop/display server is needed.
DeviceAllow=/dev/dri/card0 rw
DeviceAllow=/dev/dri/renderD128 rw
DeviceAllow=/dev/dma_heap/linux,cma rw
DeviceAllow=/dev/dma_heap/linux,cma-uncached rw
